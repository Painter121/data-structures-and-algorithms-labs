<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Prim's minimum spanning tree example</title>
  <desc id="desc">A five-vertex weighted graph where the four selected MST edges have total weight sixteen.</desc>
  <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".35"/></filter></defs>
  <rect width="960" height="510" rx="22" fill="#0b1729"/>
  <text x="50" y="55" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">Prim's minimum spanning tree</text>
  <text x="50" y="84" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Start vertex 0 · selected edges shown in green</text>
  <g transform="translate(50 108)">
    <g stroke="#526275" stroke-width="2" stroke-dasharray="7 7" opacity=".65"><path d="M400 62L210 294"/><path d="M400 62L430 286"/><path d="M570 176L430 286"/><path d="M210 294L430 286"/></g>
    <g stroke="#34d399" stroke-width="7" stroke-linecap="round"><path d="M160 80L400 62"/><path d="M400 62L570 176"/><path d="M400 62L430 286"/><path d="M160 80L210 294"/></g>
    <g fill="#9fb1c4" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><text x="278" y="60">2</text><text x="499" y="102">3</text><text x="179" y="193">6</text><text x="293" y="169">8</text><text x="431" y="170">5</text><text x="517" y="245">7</text><text x="322" y="308">9</text></g>
    <g fill="#102e49" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"><circle cx="160" cy="80" r="31"/><circle cx="400" cy="62" r="31"/><circle cx="570" cy="176" r="31"/><circle cx="210" cy="294" r="31"/><circle cx="430" cy="286" r="31"/></g>
    <g fill="#f8fafc" font-family="Consolas, monospace" font-size="19" font-weight="700" text-anchor="middle"><text x="160" y="87">0</text><text x="400" y="69">1</text><text x="570" y="183">2</text><text x="210" y="301">3</text><text x="430" y="293">4</text></g>
  </g>
  <g transform="translate(721 151)">
    <rect width="188" height="213" rx="18" fill="#10223a" stroke="#29445f"/><text x="22" y="34" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">SELECTED EDGES</text>
    <g fill="#dce8f5" font-family="Consolas, monospace" font-size="16"><text x="22" y="69">0 → 1</text><text x="143" y="69" text-anchor="end">2</text><text x="22" y="99">1 → 2</text><text x="143" y="99" text-anchor="end">3</text><text x="22" y="129">1 → 4</text><text x="143" y="129" text-anchor="end">5</text><text x="22" y="159">0 → 3</text><text x="143" y="159" text-anchor="end">6</text></g>
    <path d="M22 176H166" stroke="#36506b"/><text x="22" y="201" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">TOTAL</text><text x="166" y="201" fill="#6ee7b7" font-family="Consolas, monospace" font-size="22" font-weight="700" text-anchor="end">16</text>
  </g>
</svg>
