<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Sorting benchmark results</title>
  <desc id="desc">Average runtime of Selection Sort and Insertion Sort at one thousand, five thousand, and ten thousand data elements.</desc>
  <rect width="960" height="520" rx="22" fill="#0b1729"/>
  <text x="54" y="56" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Sorting benchmark</text>
  <text x="54" y="84" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Average of 3 runs · MinGW g++ 14.2.0 · -O2 · lower is better</text>
  <g transform="translate(82 116)">
    <g stroke="#263b54" stroke-width="1"><path d="M0 320H810"/><path d="M0 240H810"/><path d="M0 160H810"/><path d="M0 80H810"/><path d="M0 0H810"/></g>
    <g fill="#8fa3ba" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end"><text x="-14" y="325">0 ms</text><text x="-14" y="245">25 ms</text><text x="-14" y="165">50 ms</text><text x="-14" y="85">75 ms</text><text x="-14" y="5">100 ms</text></g>
    <g><rect x="86" y="316.8" width="56" height="3.2" rx="3" fill="#38bdf8"/><rect x="148" y="316" width="56" height="4" rx="3" fill="#34d399"/><rect x="331" y="243.2" width="56" height="76.8" rx="5" fill="#38bdf8"/><rect x="393" y="316.8" width="56" height="3.2" rx="3" fill="#34d399"/><rect x="576" y="9.6" width="56" height="310.4" rx="5" fill="#38bdf8"/><rect x="638" y="310.4" width="56" height="9.6" rx="4" fill="#34d399"/></g>
    <g fill="#dbe7f3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="115" y="307">1</text><text x="176" y="307">&lt;1</text><text x="359" y="234">24</text><text x="421" y="307">1</text><text x="604" y="0">97</text><text x="666" y="301">3</text></g>
    <g fill="#a8b7ca" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle"><text x="145" y="350">1,000</text><text x="390" y="350">5,000</text><text x="635" y="350">10,000</text></g>
    <text x="405" y="383" fill="#7f93aa" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">NUMBER OF DATA ELEMENTS</text>
  </g>
  <g transform="translate(619 46)" font-family="Segoe UI, Arial, sans-serif" font-size="14"><rect width="14" height="14" rx="3" fill="#38bdf8"/><text x="22" y="12" fill="#cbd5e1">Selection Sort</text><rect x="140" width="14" height="14" rx="3" fill="#34d399"/><text x="162" y="12" fill="#cbd5e1">Insertion Sort</text></g>
</svg>
