<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Terminal output showcase</title>
  <desc id="desc">Terminal-style views showing actual output from the linked list, parentheses checker, and binary search tree labs.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10233a"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="720" rx="26" fill="url(#page)"/>
  <text x="42" y="48" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Labs running in Windows Terminal</text>
  <text x="42" y="74" fill="#8da2b9" font-family="Segoe UI, Arial, sans-serif" font-size="14">Curated from the programs' actual output</text>

  <!-- Singly linked list terminal -->
  <g transform="translate(42 102)" filter="url(#shadow)">
    <rect width="548" height="302" rx="13" fill="#050b14" stroke="#263c54"/>
    <path d="M13 0H535Q548 0 548 13V40H0V13Q0 0 13 0Z" fill="#182638"/>
    <circle cx="21" cy="20" r="6" fill="#ff5f57"/><circle cx="41" cy="20" r="6" fill="#febc2e"/><circle cx="61" cy="20" r="6" fill="#28c840"/>
    <text x="274" y="25" fill="#b6c4d3" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">singlyLinkList — lab.exe</text>
    <g font-family="Cascadia Mono, Consolas, monospace" font-size="14">
      <text x="20" y="67" fill="#52d3ff">PS&gt;</text><text x="55" y="67" fill="#e6edf3"> .\lab.exe</text>
      <text x="20" y="96" fill="#f0f6fc">...Inserting...</text>
      <text x="20" y="121" fill="#7ee787">[ 1 --&gt; 2 --&gt; 3 --&gt; 4 --&gt; 5 --&gt; 7 --&gt; 8 --&gt; 9 --&gt; NULL ]</text>
      <text x="20" y="151" fill="#f0f6fc">...Deleting node at last...</text>
      <text x="20" y="176" fill="#7ee787">[ 1 --&gt; 2 --&gt; 3 --&gt; 4 --&gt; 5 --&gt; 7 --&gt; 8 --&gt; NULL ]</text>
      <text x="20" y="206" fill="#f0f6fc">...Deleting node from any Position...</text>
      <text x="20" y="231" fill="#7ee787">[ 1 --&gt; 2 --&gt; 4 --&gt; 5 --&gt; 7 --&gt; 8 --&gt; NULL ]</text>
      <text x="20" y="261" fill="#f0f6fc">Counting the Number of Nodes is :</text><text x="347" y="261" fill="#f2cc60">6</text>
      <text x="20" y="285" fill="#8b9daf">✓ insert · delete · traverse · count</text>
    </g>
  </g>

  <!-- Parentheses checker terminal -->
  <g transform="translate(42 430)" filter="url(#shadow)">
    <rect width="548" height="238" rx="13" fill="#050b14" stroke="#263c54"/>
    <path d="M13 0H535Q548 0 548 13V40H0V13Q0 0 13 0Z" fill="#182638"/>
    <circle cx="21" cy="20" r="6" fill="#ff5f57"/><circle cx="41" cy="20" r="6" fill="#febc2e"/><circle cx="61" cy="20" r="6" fill="#28c840"/>
    <text x="274" y="25" fill="#b6c4d3" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">CheckBalance2 — lab.exe</text>
    <g font-family="Cascadia Mono, Consolas, monospace" font-size="14">
      <text x="20" y="67" fill="#52d3ff">PS&gt;</text><text x="55" y="67" fill="#e6edf3"> .\lab.exe</text>
      <text x="274" y="101" fill="#f0f6fc" font-size="16" font-weight="700" text-anchor="middle">PARENTHESES CHECKER PROGRAM</text>
      <text x="20" y="137" fill="#8b9daf">Enter equation :</text><text x="166" y="137" fill="#f2cc60"> {a+[b*(c-d)]}</text>
      <rect x="20" y="159" width="91" height="31" rx="7" fill="#123b2b" stroke="#2ea043"/>
      <text x="65" y="180" fill="#7ee787" font-size="15" font-weight="700" text-anchor="middle">Correct</text>
      <text x="20" y="218" fill="#8b9daf">✓ stack is empty after the final closing bracket</text>
    </g>
  </g>

  <!-- BST terminal -->
  <g transform="translate(616 102)" filter="url(#shadow)">
    <rect width="542" height="566" rx="13" fill="#050b14" stroke="#263c54"/>
    <path d="M13 0H529Q542 0 542 13V40H0V13Q0 0 13 0Z" fill="#182638"/>
    <circle cx="21" cy="20" r="6" fill="#ff5f57"/><circle cx="41" cy="20" r="6" fill="#febc2e"/><circle cx="61" cy="20" r="6" fill="#28c840"/>
    <text x="271" y="25" fill="#b6c4d3" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">BinarySearchTree2 — sample run</text>
    <g font-family="Cascadia Mono, Consolas, monospace" font-size="14">
      <text x="20" y="67" fill="#52d3ff">PS&gt;</text><text x="55" y="67" fill="#e6edf3"> .\lab.exe</text>
      <text x="20" y="103" fill="#8b9daf"># insert nine values</text>
      <text x="20" y="128" fill="#f2cc60">1 8</text><text x="82" y="128" fill="#f2cc60">1 3</text><text x="144" y="128" fill="#f2cc60">1 10</text><text x="214" y="128" fill="#f2cc60">1 1</text><text x="276" y="128" fill="#f2cc60">1 6</text>
      <text x="20" y="153" fill="#f2cc60">1 14</text><text x="90" y="153" fill="#f2cc60">1 4</text><text x="152" y="153" fill="#f2cc60">1 7</text><text x="214" y="153" fill="#f2cc60">1 13</text>
      <text x="20" y="194" fill="#8b9daf"># command 6 — traverse</text>
      <text x="20" y="219" fill="#f2cc60">6</text>
      <text x="20" y="250" fill="#79c0ff">Preorder</text><text x="118" y="250" fill="#f0f6fc">8 3 1 6 4 7 10 14 13</text>
      <text x="20" y="280" fill="#79c0ff">Inorder</text><text x="118" y="280" fill="#7ee787">1 3 4 6 7 8 10 13 14</text>
      <text x="20" y="310" fill="#79c0ff">Postorder</text><text x="118" y="310" fill="#f0f6fc">1 4 7 6 3 13 14 10 8</text>
      <text x="20" y="351" fill="#8b9daf"># command 4 — size</text><text x="233" y="351" fill="#f2cc60">4</text>
      <text x="20" y="379" fill="#f0f6fc">9</text>
      <text x="20" y="420" fill="#8b9daf"># command 5 — minimum / maximum</text><text x="331" y="420" fill="#f2cc60">5</text>
      <text x="20" y="448" fill="#f0f6fc">Min = </text><text x="76" y="448" fill="#7ee787">1</text><text x="88" y="448" fill="#f0f6fc"> and Max = </text><text x="184" y="448" fill="#7ee787">14</text>
      <path d="M20 479H520" stroke="#1e3043"/>
      <text x="20" y="511" fill="#8b9daf">Inorder result is sorted ascending</text>
      <text x="20" y="539" fill="#7ee787">✓ BST property verified by traversal</text>
    </g>
  </g>
</svg>
